<nav class="navbar">

  <div class="navbar-brand">
    <a routerLink="/">Library</a>
  </div>

  <div class="navbar-links">

    <a routerLink="/home" routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }">
      Home
    </a>

    <a routerLink="/books" routerLinkActive="active">
      Books
    </a>

    <a routerLink="/wishlist" routerLinkActive="active">
      Wishlist
    </a>

    <a routerLink="/orders" routerLinkActive="active">
      My Orders
    </a>

    <a routerLink="/about" routerLinkActive="active">
      About
    </a>

  </div>

  <div class="navbar-actions">

    <a routerLink="/cart" class="cart-link">
      Cart
    </a>

    @if (authService.isAuthenticated()) {
      <a routerLink="/profile" class="profile-link">
        {{ authService.user()?.firstName }}
      </a>

      <button type="button" class="login-btn" (click)="authService.logout()">
        Logout
      </button>
    } @else {
      <a routerLink="/auth/login" class="login-btn">
        Login
      </a>
    }

  </div>

</nav>
